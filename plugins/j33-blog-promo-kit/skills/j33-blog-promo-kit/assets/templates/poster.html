<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* ── bundled faces, no network ─────────────────────────────────────────── */
@font-face{
  font-family:'Inter';
  src:url('../fonts/Inter.ttf') format('truetype-variations'),
      url('../fonts/Inter.ttf') format('truetype');
  font-weight:100 900; font-style:normal; font-display:block;
}
@font-face{
  font-family:'Anton';
  src:url('../fonts/Anton-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:block;
}

/* ── J33.AI tokens (see references/brand.md) ───────────────────────────── */
/* --brand-cyan belongs to the lockup and no theme touches it. Plate and accent
   colours arrive per render as --c-* variables from profiles.py. */
:root{
  --brand-cyan:#0099CC;
  --photo-dark:#02080F;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

/* ── canvas ─────────────────────────────────────────────────────────────── */
.poster{
  position:relative; overflow:hidden;
  width:var(--w); height:var(--h);
}
.bg{position:absolute; inset:0; z-index:0}
.grain{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  mix-blend-mode:multiply; opacity:.30;
}
.frame{
  position:absolute; z-index:2;
  left:var(--inset-x); right:var(--inset-x);
  top:var(--inset-y); bottom:var(--inset-y);
  display:flex; gap:var(--gutter);
}

/* ── surfaces ───────────────────────────────────────────────────────────── */
.poster[data-surface="paper"] .bg{background:var(--c-paper)}
.poster[data-surface="dark"]  .bg{
  background:
    radial-gradient(120% 90% at 78% 108%, var(--c-glow) 0%, var(--c-glow-0) 60%),
    linear-gradient(152deg, var(--c-dark-from) 0%, var(--c-dark-to) 100%);
}
.poster[data-surface="photo"] .bg{background:var(--photo-dark)}
.photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0}
.scrim{position:absolute; inset:0; z-index:1}
/* The scrim clears rightwards on wide/split, where the text stays left, and
   fades top-to-bottom on stack, where the headline runs the full width.
   Same stops as compose.py. */
.poster[data-surface="photo"] .scrim{
  background:
    linear-gradient(90deg, rgba(2,8,15,.94) 0%, rgba(2,8,15,.80) 38%, rgba(2,8,15,0) 68%),
    linear-gradient(0deg, var(--c-photo-tint), var(--c-photo-tint));
}
.poster[data-surface="photo"][data-layout="stack"] .scrim{
  background:
    linear-gradient(180deg, rgba(2,8,15,.90) 0%, rgba(2,8,15,.62) 100%),
    linear-gradient(0deg, var(--c-photo-tint), var(--c-photo-tint));
}

/* faint technical grid, dark surfaces only */
.grid{position:absolute; inset:0; z-index:1; opacity:.055}
.poster[data-surface="paper"] .grid{display:none}

/* ── columns ────────────────────────────────────────────────────────────── */
.col-text{
  display:flex; flex-direction:column; justify-content:center;
  min-width:0; min-height:0;
}
.col-art{
  display:flex; align-items:center; justify-content:center;
  min-width:0; min-height:0; overflow:hidden;
}
/* An SVG with a viewBox letterboxes itself, so give it the full box. */
.col-art > svg{width:100%; height:100%; display:block}
.col-art > img{max-width:100%; max-height:100%; display:block}

/* --text-frac comes from profiles.text_frac(), shared with compose.py and verify.py. */
.poster[data-layout="wide"]  .frame,
.poster[data-layout="split"] .frame{flex-direction:row; align-items:stretch}
.poster[data-layout="wide"]  .col-text,
.poster[data-layout="split"] .col-text{flex:0 0 calc(var(--text-frac) * 100%)}
.poster[data-layout="wide"]  .col-art,
.poster[data-layout="split"] .col-art{flex:1 1 auto}

.poster[data-layout="stack"] .frame{flex-direction:column; justify-content:center}
.poster[data-layout="stack"] .col-text{flex:0 0 auto}
/* flex-basis 0 gives the item a definite height, so the SVG's height:100%
   resolves instead of rendering tiny. */
.poster[data-layout="stack"] .col-art {flex:1 1 0; width:100%; margin-top:var(--gutter); min-height:calc(var(--stack-art-frac) * 100%)}
.poster[data-art="none"] .col-art{display:none}

/* ── type ───────────────────────────────────────────────────────────────── */
.eyebrow{
  font-weight:700; font-size:var(--fs-eyebrow);
  letter-spacing:.16em; text-transform:uppercase;
  margin-bottom:calc(var(--u) * 1.6);
}
.headline{
  font-size:var(--fs-headline);
  line-height:1.08;           /* the brand's display leading */
  letter-spacing:-.025em;
  font-weight:900;
  white-space:pre-line;       /* honours \n in the spec */
  overflow-wrap:break-word;
  text-wrap:balance;          /* evens the rag; kills one-word last lines */
}
.poster[data-display="anton"] .headline{
  font-family:'Anton',Impact,sans-serif;
  font-weight:400; text-transform:uppercase; letter-spacing:.002em; line-height:1.02;
}
.subhead{
  font-size:var(--fs-subhead); line-height:1.34; font-weight:500;
  margin-top:calc(var(--u) * 1.9); max-width:24em; text-wrap:balance;
}
.rule{
  height:max(2px, calc(var(--u) * .22)); width:100%;
  margin-top:calc(var(--u) * 2.6); margin-bottom:calc(var(--u) * 1.5);
}
.kicker{
  font-size:var(--fs-kicker); font-weight:700; letter-spacing:.10em;
  text-transform:uppercase;
}
.logo{
  font-size:var(--fs-logo); font-weight:800; letter-spacing:-.02em; line-height:1;
}

.logo-top{margin-bottom:calc(var(--u) * 3.4)}
.logo-bot{margin-top:calc(var(--u) * 3.0)}
.poster[data-logo="bottom"] .logo-top{display:none}
.poster[data-logo="top"] .logo-bot{display:none}

/* type colours arrive from profiles.py as --c-* variables */
.poster{color:var(--c-fg)}
.eyebrow,.accent{color:var(--c-accent)}
.subhead{color:var(--c-subhead)}
.rule{background:var(--c-rule)}
.kicker{color:var(--c-kicker)}
/* The lockup is the mark, so it keeps the brand colours whatever the theme. */
.logo{color:var(--c-logo)}
.logo .ai{color:var(--brand-cyan)}

/* ── code artwork ───────────────────────────────────────────────────────── */
.code{
  width:100%; border-radius:calc(var(--u) * 1.1);
  padding:calc(var(--u) * 2.4) calc(var(--u) * 2.6);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs-code); line-height:1.62; white-space:pre;
  overflow:hidden;
  background:var(--c-code-panel); border:2px solid var(--c-code-edge); color:var(--c-code-fg);
}
.code .hl{color:var(--c-accent); font-weight:600}
.code-lang{
  display:block; font-family:'Inter',sans-serif; font-weight:700;
  font-size:var(--fs-kicker); letter-spacing:.12em; text-transform:uppercase;
  opacity:.55; margin-bottom:calc(var(--u) * 1.4);
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  const P = window.__PAYLOAD__;
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // Wrap the accent phrase in a span. Case-insensitive, first occurrence only.
  function withAccent(headline, accent){
    const h = esc(headline);
    if(!accent) return h;
    const a = esc(accent);
    const i = h.toLowerCase().indexOf(a.toLowerCase());
    if(i < 0) return h;
    return h.slice(0,i) + '<span class="accent">' + h.slice(i, i+a.length) + '</span>' + h.slice(i+a.length);
  }

  function codeBlock(c){
    const lines = (c.lines||[]).map((ln,i) =>
      (c.highlight||[]).includes(i)
        ? '<span class="hl">' + esc(ln) + '</span>'
        : esc(ln)
    ).join('\n');
    const lang = c.lang ? '<span class="code-lang">' + esc(c.lang) + '</span>' : '';
    return '<div class="code">' + lang + lines + '</div>';
  }

  const grainSVG =
    "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">' +
      '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>' +
      '<feColorMatrix type="saturate" values="0"/></filter>' +
      '<rect width="180" height="180" filter="url(#n)" opacity="0.42"/></svg>');

  const gridSVG =
    "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">' +
      '<path d="M64 0H0v64" fill="none" stroke="#fff" stroke-width="1"/></svg>');

  const logo = cls => '<div class="logo ' + cls + '">J33<span class="ai">.AI</span></div>';

  let art = '';
  if(P.art === 'diagram' && P.art_svg)      art = P.art_svg;
  else if(P.art === 'code' && P.art_code)   art = codeBlock(P.art_code);
  else if(P.art === 'photo' && P.art_img)   art = '<img src="' + P.art_img + '">';

  const bg = P.surface === 'photo' && P.photo
    ? '<div class="bg"><img class="photo" src="' + P.photo + '"><div class="scrim"></div></div>'
    : '<div class="bg"></div>';

  // Geometry, type and colours all come from profiles.py. Translucent colours
  // arrive as (r, g, b, a) with a in 0-255.
  const rgba = ([r, g, b, a]) => 'rgba(' + r + ',' + g + ',' + b + ',' + (a / 255).toFixed(3) + ')';
  const vars = {
    '--w':          P.w + 'px',
    '--h':          P.h + 'px',
    '--u':          P.u + 'px',
    '--inset-x':    P.inset_x + 'px',
    '--inset-y':    P.inset_y + 'px',
    '--gutter':     P.gutter + 'px',
    '--text-frac':  P.text_frac,
    '--stack-art-frac': P.stack_art_frac,
    '--fs-headline':P.fs_headline_max + 'px',
    '--fs-eyebrow': P.fs_eyebrow + 'px',
    '--fs-subhead': P.fs_subhead + 'px',
    '--fs-kicker':  P.fs_kicker + 'px',
    '--fs-logo':    P.fs_logo + 'px',
    '--fs-code':    P.fs_code + 'px',
    '--c-fg':       P.c_fg,
    '--c-subhead':  P.c_subhead,
    '--c-kicker':   P.c_kicker,
    '--c-rule':     rgba(P.c_rule),
    '--c-accent':   P.c_accent,
    '--c-logo':     P.c_logo_j33,
    '--c-paper':    P.c_paper,
    '--c-dark-from':P.c_dark_from,
    '--c-dark-to':  P.c_dark_to,
    '--c-glow':     rgba(P.c_glow),
    '--c-glow-0':   rgba([P.c_glow[0], P.c_glow[1], P.c_glow[2], 0]),
    '--c-photo-tint': rgba(P.c_photo_tint),
    '--c-code-fg':  P.c_code_fg,
    '--c-code-panel': rgba(P.c_code_panel),
    '--c-code-edge':  rgba(P.c_code_edge)
  };
  const styleAttr = Object.entries(vars).map(([k,v]) => k + ':' + v).join(';');

  document.getElementById('root').innerHTML =
    '<div class="poster" style="' + styleAttr + '"' +
        ' data-surface="' + P.surface + '" data-layout="' + P.layout +
        '" data-display="' + (P.display||'inter') + '" data-art="' + (art ? P.art : 'none') +
        '" data-logo="' + (P.logo_top ? 'top' : 'bottom') + '">' +
      bg +
      '<div class="grid" style="background-image:url(\'' + gridSVG + '\');background-size:' +
          (P.w/22).toFixed(1) + 'px ' + (P.w/22).toFixed(1) + 'px"></div>' +
      (P.surface === 'paper'
        ? '<div class="grain" style="background-image:url(\'' + grainSVG + '\')"></div>' : '') +
      '<div class="frame">' +
        '<div class="col-text">' +
          logo('logo-top') +
          (P.eyebrow ? '<div class="eyebrow">' + esc(P.eyebrow) + '</div>' : '') +
          '<h1 class="headline">' + withAccent(P.headline, P.accent) + '</h1>' +
          (P.subhead ? '<div class="subhead">' + esc(P.subhead) + '</div>' : '') +
          (P.kicker ? '<div class="rule"></div><div class="kicker">' + esc(P.kicker) + '</div>' : '') +
          logo('logo-bot') +
        '</div>' +
        (art ? '<div class="col-art">' + art + '</div>' : '') +
      '</div>' +
    '</div>';

  const poster = document.querySelector('.poster');
  const frame  = document.querySelector('.frame');
  const col    = document.querySelector('.col-text');

  // ── fit the code block ──────────────────────────────────────────────────
  // Pre-formatted code clips at the box edge; shrink until the longest line fits.
  (function(){
    const code = document.querySelector('.code');
    if(!code) return;
    let cs = P.fs_code, guard = 300;
    const floor = P.fs_code * 0.55;
    while(code.scrollWidth > code.clientWidth && cs > floor && guard-- > 0){
      cs -= 0.5;
      poster.style.setProperty('--fs-code', cs + 'px');
    }
    window.__CODE_FIT__ = {size: cs, clipped: code.scrollWidth > code.clientWidth};
  })();

  // ── tighten the artwork viewBox ─────────────────────────────────────────
  // Hand-authored SVG usually has slack in its viewBox that shrinks the
  // drawing. Refit to what was drawn, padded for strokes and markers, which
  // getBBox() ignores.
  (function(){
    const s = document.querySelector('.col-art > svg');
    if(!s || !P.fit_viewbox) return;
    try{
      const b = s.getBBox();
      if(!(b.width > 0 && b.height > 0)) return;
      const pad = Math.max(6, Math.max(b.width, b.height) * 0.03);
      s.setAttribute('viewBox',
        (b.x - pad) + ' ' + (b.y - pad) + ' ' +
        (b.width + pad * 2) + ' ' + (b.height + pad * 2));
    }catch(e){ /* getBBox throws on an empty or detached svg; leave as authored */ }
  })();

  // ── auto-fit the headline ───────────────────────────────────────────────
  // Shrink until the column fits. Report the final size so kit.py can warn
  // when it bottomed out: that means cut words, not lower the floor. In
  // `stack` the artwork shares the vertical budget, so measure the frame,
  // not the column alone.
  const measure = () => P.layout === 'stack'
    ? Math.max(frame.scrollHeight, col.scrollHeight + artHeight())
    : col.scrollHeight;
  const artEl = document.querySelector('.col-art');
  const artHeight = () => {
    if(!artEl) return 0;
    const gutter = parseFloat(getComputedStyle(artEl).marginTop) || 0;
    // The SVG letterboxes, so its floor is what the code/img block needs.
    const inner = artEl.firstElementChild;
    if(inner && inner.tagName.toLowerCase() === 'svg') return gutter + P.h * 0.16;
    return gutter + (inner ? inner.scrollHeight : 0);
  };

  let size = P.fs_headline_max;
  poster.style.setProperty('--fs-headline', size + 'px');
  const budget = frame.clientHeight;
  let guard = 400;
  while(measure() > budget && size > P.fs_headline_min && guard-- > 0){
    size -= 1;
    poster.style.setProperty('--fs-headline', size + 'px');
  }
  window.__FIT__ = {size: size, floored: size <= P.fs_headline_min};
  document.documentElement.setAttribute('data-ready','1');
})();
</script>
</body>
</html>
